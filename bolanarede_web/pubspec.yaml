name: bolanarede_web
description: "BolaNaRede Field Manager — painel web de gerenciamento de campos de futebol."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  dio: 5.9.2
  fl_chart: ^0.69.0
  flutter:
    sdk: flutter
  flutter_dotenv: 6.0.1
  flutter_riverpod: 3.3.1
  go_router: 17.2.2
  json_annotation: ^4.9.0
  phosphor_flutter: 2.1.0
  shared_preferences: 2.5.5

dev_dependencies:
  build_runner: ^2.4.0
  flutter_test:
    sdk: flutter
  import_sorter: ^4.6.0
  json_serializable: ^6.8.0
  very_good_analysis: 10.0.0

flutter:
  uses-material-design: true
  assets:
    - .env

import_sorter:
  comments: false
  ignored_files:
    - \.g\.dart
