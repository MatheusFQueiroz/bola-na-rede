name: bola_na_rede
description: "Aplicativo do Bola na Rede — rede social de futebol amador para organizar peladas, partidas formais, ranking e gamificação entre jogadores."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  cached_network_image: ^3.4.1
  dio: 5.9.2
  flutter:
    sdk: flutter
  flutter_dotenv: 6.0.1
  flutter_riverpod: 3.3.1
  flutter_secure_storage: ^9.2.4
  go_router: 17.2.2
  json_annotation: ^4.9.0
  phosphor_flutter: 2.1.0
  pretty_dio_logger: ^1.4.0
  shared_preferences: 2.5.5
  provider: ^6.1.2
  uuid: ^4.3.3

dev_dependencies:
  build_runner: ^2.4.0
  flutter_test:
    sdk: flutter
  import_sorter: ^4.6.0
  json_serializable: ^6.8.0
  very_good_analysis: 10.0.0

flutter:
  assets:
    - .env
    - assets/

import_sorter:
  comments: false
  ignored_files:
    - \.g\.dart
