events { worker_connections 1024; }

http {
  # Docker's internal DNS — re-resolves IPs when containers restart
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 5s;

  server {
    listen 3000;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_read_timeout                 60s;

    location /v1/auth {
      set $upstream http://identity:4001;
      proxy_pass $upstream;
    }
    location /v1/users {
      set $upstream http://identity:4001;
      proxy_pass $upstream;
    }
    location /v1/teams {
      set $upstream http://team:4002;
      proxy_pass $upstream;
    }
    location /v1/fields {
      set $upstream http://field:4003;
      proxy_pass $upstream;
    }
    location /v1/open-games {
      set $upstream http://open-game:4004;
      proxy_pass $upstream;
    }
    location /v1/reviews {
      set $upstream http://social:4005;
      proxy_pass $upstream;
    }
    location /v1/scores {
      set $upstream http://social:4005;
      proxy_pass $upstream;
    }
    location /v1/profiles {
      set $upstream http://gamification:4006;
      proxy_pass $upstream;
    }
    location /v1/leaderboard {
      set $upstream http://gamification:4006;
      proxy_pass $upstream;
    }
    location /v1/seasons {
      set $upstream http://gamification:4006;
      proxy_pass $upstream;
    }
    location /v1/challenges {
      set $upstream http://gamification:4006;
      proxy_pass $upstream;
    }
    location /v1/leagues {
      set $upstream http://gamification:4006;
      proxy_pass $upstream;
    }
    location /v1/match-requests {
      set $upstream http://matchmaking:4007;
      proxy_pass $upstream;
    }
    location /v1/matches {
      set $upstream http://matchmaking:4007;
      proxy_pass $upstream;
    }
    location /v1/games {
      set $upstream http://game:4008;
      proxy_pass $upstream;
    }
    location /v1/rankings {
      set $upstream http://ranking:4009;
      proxy_pass $upstream;
    }
    location /v1/notifications {
      set $upstream http://notification:4010;
      proxy_pass $upstream;
    }
  }
}
