services:
  # ── Infrastructure ───────────────────────────────────────────────────────────

  postgres-identity:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bolanarededb_identity
    ports:
      - "5432:5432"
    volumes:
      - postgres_identity_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bolanarededb_identity"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 10

  postgres-team:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bolanarededb_team
    ports:
      - "5433:5432"
    volumes:
      - postgres_team_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bolanarededb_team"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-field:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bolanarededb_field
    ports:
      - "5434:5432"
    volumes:
      - postgres_field_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bolanarededb_field"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-open-game:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bolanarededb_open_game
    ports:
      - "5435:5432"
    volumes:
      - postgres_open_game_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bolanarededb_open_game"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-social:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bolanarededb_social
    ports:
      - "5436:5432"
    volumes:
      - postgres_social_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bolanarededb_social"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Services ─────────────────────────────────────────────────────────────────

  identity:
    build:
      context: .
      dockerfile: services/identity/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 4001
      JWT_SECRET: bolanarededb-secret
      DATABASE_URL: postgres://postgres:postgres@postgres-identity:5432/bolanarededb_identity
      RABBITMQ_URL: amqp://admin:admin@rabbitmq:5672
    ports:
      - "4001:4001"
    depends_on:
      postgres-identity:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  team:
    build:
      context: .
      dockerfile: services/team/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 4002
      JWT_SECRET: bolanarededb-secret
      DATABASE_URL: postgres://postgres:postgres@postgres-team:5432/bolanarededb_team
      RABBITMQ_URL: amqp://admin:admin@rabbitmq:5672
    ports:
      - "4002:4002"
    depends_on:
      postgres-team:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  field:
    build:
      context: .
      dockerfile: services/field/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 4003
      JWT_SECRET: bolanarededb-secret
      DATABASE_URL: postgres://postgres:postgres@postgres-field:5432/bolanarededb_field
      RABBITMQ_URL: amqp://admin:admin@rabbitmq:5672
    ports:
      - "4003:4003"
    depends_on:
      postgres-field:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  open-game:
    build:
      context: .
      dockerfile: services/open-game/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 4004
      JWT_SECRET: bolanarededb-secret
      DATABASE_URL: postgres://postgres:postgres@postgres-open-game:5432/bolanarededb_open_game
      RABBITMQ_URL: amqp://admin:admin@rabbitmq:5672
      REDIS_URL: redis://redis:6379
    ports:
      - "4004:4004"
    depends_on:
      postgres-open-game:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  social:
    build:
      context: .
      dockerfile: services/social/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 4005
      JWT_SECRET: bolanarededb-secret
      DATABASE_URL: postgres://postgres:postgres@postgres-social:5432/bolanarededb_social
      RABBITMQ_URL: amqp://admin:admin@rabbitmq:5672
    ports:
      - "4005:4005"
    depends_on:
      postgres-social:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  postgres-gamification:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bolanarededb_gamification
    ports:
      - "5437:5432"
    volumes:
      - postgres_gamification_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  gamification:
    build:
      context: .
      dockerfile: services/gamification/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 4006
      JWT_SECRET: bolanarededb-secret
      DATABASE_URL: postgres://postgres:postgres@postgres-gamification:5432/bolanarededb_gamification
      RABBITMQ_URL: amqp://admin:admin@rabbitmq:5672
    ports:
      - "4006:4006"
    depends_on:
      postgres-gamification:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  postgres-matchmaking:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bolanarededb_matchmaking
    ports:
      - "5438:5432"
    volumes:
      - postgres_matchmaking_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  matchmaking:
    build:
      context: .
      dockerfile: services/matchmaking/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 4007
      JWT_SECRET: bolanarededb-secret
      DATABASE_URL: postgres://postgres:postgres@postgres-matchmaking:5432/bolanarededb_matchmaking
      RABBITMQ_URL: amqp://admin:admin@rabbitmq:5672
      REDIS_URL: redis://redis:6379
    ports:
      - "4007:4007"
    depends_on:
      postgres-matchmaking:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres-game:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bolanarededb_game
    ports:
      - "5439:5432"
    volumes:
      - postgres_game_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bolanarededb_game"]
      interval: 5s
      timeout: 5s
      retries: 5

  game:
    build:
      context: .
      dockerfile: services/game/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 4008
      JWT_SECRET: bolanarededb-secret
      DATABASE_URL: postgres://postgres:postgres@postgres-game:5432/bolanarededb_game
      RABBITMQ_URL: amqp://admin:admin@rabbitmq:5672
    ports:
      - "4008:4008"
    depends_on:
      postgres-game:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  postgres_identity_data:
  postgres_team_data:
  postgres_field_data:
  postgres_open_game_data:
  postgres_social_data:
  postgres_gamification_data:
  postgres_matchmaking_data:
  postgres_game_data:
